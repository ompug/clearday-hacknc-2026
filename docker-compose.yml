# Local TimescaleDB: the backup database when Tiger Cloud is unreachable.
# Matches DATABASE_URL_LOCAL in api/.env.example. Dev-only credentials.
services:
  db:
    image: docker.io/timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: clearday
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clearday-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clearday"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  clearday-pg:
