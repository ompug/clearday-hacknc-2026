[project]
name = "clearday"
version = "0.1.0"
description = "Clearday (HackNC 2026): social money app for roommates"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["analytics/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
